[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amlinterp"
version = "0.1.0"
description = "Interpreting provably powerful GNNs (GIN -> Multi-GIN ladder) on synthetic patterns and AMLworld."
requires-python = ">=3.10"
# Pinned dependencies live in requirements.txt (torch/PyG need custom wheel indexes).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
